name: Automatización de Pull Requests

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - edited

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    validar-etiquetar-y-comentar:
        name: Validar, etiquetar y comentar
        runs-on: ubuntu-latest

        steps:

            - name: Etiquetar cambios de documentación
              uses: actions/github-script@v7
              with:
                script: |
                  const files = await github.paginate(
                    github.rest.pulls.listFiles,
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: context.issue.number,
                      by_page: 100
                    }
                  );
                  
                  const onlyDocumentation = files.length > 0 &&
                    files.every((file) =>
                      file.filename.startsWith('docs/') ||
                      file.filename.toLowerCase() === 'readme.md'
                    );

                    if (onlyDocumentation) {
                      await github.rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        labels: ['documentation'] 
                      });

                      core.info('Etiqueta aplicada: documentation');
                    }

            - name: Etiquetar Pull Request según la rama
              uses: actions/github-script@v7
              with:
                script: |
                  const branch = context.payload.pull_request.head.ref;
                  let label = 'otros';

                  if (branch.startsWith('feature/')) {
                    label = 'feature';
                  } else if (branch.startsWith('fix/')){
                    label = 'bug';
                  } else if (branch.startsWith('hotfix/')){
                    label = 'hotfix'; 
                  }

                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    labels: [label]
                  });

                  core.info(`Etiqueta aplicada: ${label}`);

            - name: Validar título del Pull Request
              uses: actions/github-script@v7
              with:
                script: |
                  const title = context.payload.pull_request.title;
                  const allowedPrefixes = [
                    'feat:',
                    'fix:',
                    'docs:',
                    'ci:',
                    'test:',
                    'chore:'
                  ];

                  const isValid = allowedPrefixes.some((prefix) => 
                    title.toLowerCase().startsWith(prefix)
                  );

                  if(!isValid) {
                    core.setFailed(
                    `El título "${title}" debe comenzar con: ${allowedPrefixes.join(', ')}`
                    );
                  }

                  core.info(`Título validado: ${title}`);

            - name: Comentar instrucciones iniciales
              if: github.event.action == 'opened'
              uses: actions/github-script@v7
              with:
                script: |
                  const author = context.payload.pull_request.user.login;

                    await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        body: [
                            `¡Gracias por tu Pull Request, @${author}!`,
                            '',
                            '### Lista de verificación',
                            '- [ ] Se ejecutaron pruebas locales.',
                            '- [ ] El cambio está documentado cuando aplica.',
                            '- [ ] El título cumple el formato acordado.',
                            '- [ ] Todos los checks de CI están en verde.'
                        ].join('\n')
                    });
