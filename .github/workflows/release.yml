name: Crear release

on:
    push:
        tags:
            - 'v*'

    workflow_dispatch:
        inputs:
            tag:
                description: Tag de versión a publicar, por ejemplo v1.0.0
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        name: Validar, compilar y publicar release
        runs-on: ubuntu-latest

        steps:
            - name: Descargar código
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

            - name: Determinar tag de release
              id: version
              shell: bash
              run: |
                if [ "${{  github.event_name }}" = "workflow_dispatch" ]; then
                  TAG="${{ inputs.tag }}"
                else
                  TAG="${GITHUB_REF_NAME}"
                fi

                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                echo "Tag seleccionado: $TAG"

            - name: Validar versión semántica
              shell: bash
              run: |
                TAG="${{ steps.version.outputs.tag }}"

                if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                  echo "Error: el tag '$TAG' no cumple el formato vMAJOR.MINOR.PATCH."
                  exit 1
                fi

                echo "Formato de versión válido: $TAG"

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm

            - name: Instalar dependencias
              run: npm ci

            - name: Ejecutar lint
              run: npm run lint

            - name: Ejecutar pruebas
              run: npm test

            - name: Generar build
              run: npm run build

            - name: Empaquetar build
              shell: bash
              run: |
                mkdir -p release
                zip -r "release/github-actions-lab-${{ steps.version.outputs.tag }}.zip" dist/
                ls -lh release/

            - name: Crear GitHub release
              uses: softprops/action-gh-release@v2
              with:
                tag_name: ${{ steps.version.outputs.tag }}
                name: Release ${{ steps.version.outputs.tag }}
                generate_release_notes: true
                files: release/github-actions-lab-${{ steps.version.outputs.tag }}.zip